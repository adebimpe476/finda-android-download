# Independent, static FINDA Android download landing page.
# No build command, functions, edge functions, or plugins.
# IMPORTANT: This repo is NOT linked to Netlify. Pushing to GitHub costs ZERO Netlify credits.
[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
